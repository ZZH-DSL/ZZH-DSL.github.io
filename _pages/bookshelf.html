---
layout: archive
title: "Bookshelf"
permalink: /bookshelf/
author_profile: true
---

{% include base_path %}

<div class="book-grid">
  {% for post in site.books reversed %}
    <div class="book-item">
      <a href="{{ post.url | relative_url }}">
        <img src="{{ post.cover | relative_url }}" alt="{{ post.title }}" class="book-cover">
      </a>
      <h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
      <p>{{ post.author }}</p>
    </div>
  {% endfor %}
</div>
